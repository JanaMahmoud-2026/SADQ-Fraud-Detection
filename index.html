<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SADQ - Fraud Detection</title>
<style>
body{font-family:Arial;background:#f5f7fb;margin:0}
.header{background:#1a1a2e;color:white;padding:30px;text-align:center}
.container{max-width:800px;margin:-20px auto;background:white;border-radius:15px;padding:25px;box-shadow:0 5px 20px rgba(0,0,0,.1)}
input,button{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #ddd}
button{background:#1a1a2e;color:white;font-weight:bold;cursor:pointer}
.result{margin-top:15px;padding:15px;border-radius:10px;display:none;text-align:center;font-weight:bold}
.safe{background:#e8f5e9;color:#2e7d32} .fraud{background:#ffebee;color:#c62828}
</style></head>
<body>
<div class="header"><h1>🛡️ SADQ</h1><p>نظام كشف الاحتيال - Jana Mahmoud 2026</p></div>
<div class="container">
<h3>جربي النظام بنفسك</h3>
<label>مبلغ العملية</label><input id="amount" type="number" value="1200">
<label>الساعة (0-23)</label><input id="time" type="number" value="14">
<button onclick="check()">فحص العملية 🔍</button>
<div id="result" class="result"></div>
<h4 style="margin-top:30px">عن المشروع</h4><p>نموذج ذكاء اصطناعي بدقة 99% لكشف الاحتيال المالي</p>
</div>
<script>
function check(){
let a=document.getElementById('amount').value, t=document.getElementById('time').value, r=document.getElementById('result');
r.style.display='block';
if(a>10000 && (t<5||t>22) || a>20000){r.className='result fraud'; r.innerHTML='🚨 احتيال مشبوه! يجب المراجعة';}
else{r.className='result safe'; r.innerHTML='✅ العملية آمنة';}
}
</script></body></html>
